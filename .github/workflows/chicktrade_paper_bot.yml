name: CHICKTRADE v3.0 Free Paper Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chicktrade-paper-state
  cancel-in-progress: false

jobs:
  run-paper-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run CHICKTRADE v3.0 Paper Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
          TURBO_ENABLED: ${{ vars.TURBO_ENABLED }}
        run: |
          python cloud_bot/paper_engine_v3.py --once

      - name: Commit and push updated dashboard JSON
        run: |
          git config user.name "chicktrade-paper-bot"
          git config user.email "chicktrade-paper-bot@users.noreply.github.com"
          git add docs/data/live_dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(paper): update live_dashboard.json"
            git push
          else
            echo "No changes to live_dashboard.json"
          fi
